{% extends "admin/base_site.html" %}

{% block breadcrumbs %}
<div class="breadcrumbs"><a href="{{ question_url }}">Вопрос</a> › Указать исход</div>
{% endblock %}

{% block content %}
<p>{{ question.title }}</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="submit-row">
    <input type="submit" value="Указать исход и начислить очки" class="default">
    <a href="{{ question_url }}">Отмена</a>
  </div>
</form>
{% endblock %}
